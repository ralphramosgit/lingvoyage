# Deploys the backend to the lingvoyage-api Lambda function on every push to main that changes
# backend/. Same as building lambda.zip and running `aws lambda update-function-code` by hand
# (guide 07, section 12). Needs the AWS_DEPLOY_ROLE_ARN repository secret (guide 12).
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # "Run workflow" button on GitHub, to redeploy main by hand

# One deploy at a time; if several pushes queue up, only the newest waiting one runs.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # lets the job sign in to AWS with a short-lived token instead of a stored access key

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # Don't deploy code that fails the same tests you run locally.
      - run: python -m pytest

      # Same as scripts/build_lambda.ps1: Linux packages for Lambda's Python 3.13 (x86_64), plus app/.
      - name: Build lambda.zip
        run: |
          pip install -r requirements.txt \
            --platform manylinux2014_x86_64 --implementation cp --python-version 3.13 \
            --only-binary=:all: --target build --upgrade
          cp -r app build/app
          find build -type d -name __pycache__ -prune -exec rm -rf {} +
          python -c "import shutil; shutil.make_archive('lambda', 'zip', 'build')"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Upload to Lambda
        run: |
          aws lambda update-function-code --function-name lingvoyage-api --zip-file fileb://lambda.zip \
            --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name lingvoyage-api

      # A red run here means the new code is live but broken: check CloudWatch logs (guide 07, section 11).
      - name: Check /health
        run: |
          url=$(aws lambda get-function-url-config --function-name lingvoyage-api --query FunctionUrl --output text)
          curl --fail --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors "${url}health"
