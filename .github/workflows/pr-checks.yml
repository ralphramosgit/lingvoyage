# Runs the same checks as the publish and deploy workflows on every pull request into main, so errors
# show up before merging instead of after. Uses no secrets. Required to pass by the main ruleset (team guide 01).
name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    name: mobile typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
